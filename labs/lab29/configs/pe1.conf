configure terminal
hostname pe1
router isis CORE
 is-type level-2-only
 net 49.0029.0000.0000.0001.00
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
exit
interface lo
 ip router isis CORE
 isis passive
exit
interface eth1
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis hello-interval 1
 isis hello-multiplier 3
exit
mpls ldp
 router-id 10.255.0.1
 address-family ipv4
  discovery transport-address 10.255.0.1
  interface eth1
  exit
 exit-address-family
exit
ip prefix-list SITE1-IN seq 10 permit 10.29.1.0/24
route-map SITE1-IN permit 10
 match ip address prefix-list SITE1-IN
exit
ip prefix-list SITE1-OUT seq 10 permit 10.29.2.0/24
ip prefix-list SITE1-OUT seq 20 permit 10.29.3.0/24
ip prefix-list SITE1-OUT seq 30 permit 10.29.0.0/16
ip prefix-list SITE1-OUT seq 40 permit 0.0.0.0/0
route-map SITE1-OUT permit 10
 match ip address prefix-list SITE1-OUT
exit
router bgp 64500
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 neighbor 10.255.0.2 remote-as 64500
 neighbor 10.255.0.2 update-source lo
 address-family ipv4 vpn
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 send-community extended
 exit-address-family
exit
router bgp 64500 vrf site1
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 neighbor 10.29.255.1 remote-as 64501
 address-family ipv4 unicast
  neighbor 10.29.255.1 activate
  neighbor 10.29.255.1 route-map SITE1-IN in
  neighbor 10.29.255.1 route-map SITE1-OUT out
  neighbor 10.29.255.1 maximum-prefix 8 75 restart 1
 exit-address-family
 address-family ipv4 unicast
  rd vpn export 10.255.0.1:100
  label vpn export auto
  label vpn export allocation-mode per-vrf
  rt vpn import 64500:2900
  rt vpn export 64500:2900
  route-map vpn export SITE1-IN
  import vpn
  export vpn
 exit-address-family
exit
end
