# Linux teaching topology; consult README for validation scope.
name: first-routed
topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.2.1
  nodes:
    r1:
      kind: linux
      exec:
      - ip address replace 10.0.12.1/30 dev eth1
      - ip link set eth1 up
      - ip route replace 10.0.23.0/30 via 10.0.12.2
    r2:
      kind: linux
      exec:
      - ip address replace 10.0.12.2/30 dev eth1
      - ip address replace 10.0.23.1/30 dev eth2
      - ip link set eth1 up
      - ip link set eth2 up
      - sysctl -w net.ipv4.ip_forward=1
    r3:
      kind: linux
      exec:
      - ip address replace 10.0.23.2/30 dev eth1
      - ip link set eth1 up
      - ip route replace 10.0.12.0/30 via 10.0.23.1
  links:
  - endpoints:
    - r1:eth1
    - r2:eth1
  - endpoints:
    - r2:eth2
    - r3:eth1
