configure terminal
hostname core
key chain LAB19
 key 19
  key-string LAB19-DEMO-ONLY-DO-NOT-REUSE-2026
  cryptographic-algorithm hmac-sha-256
 exit
exit
interface eth1
 ip ospf area 0
 bandwidth 10000
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf authentication key-chain LAB19
exit
interface eth2
 ip ospf area 0
 bandwidth 10000
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf authentication key-chain LAB19
exit
interface lo
 ip ospf area 0
exit
router ospf
 ospf router-id 10.255.0.13
 auto-cost reference-bandwidth 400000
 passive-interface default
 no passive-interface eth1
 no passive-interface eth2
exit
ip route 203.0.113.0/24 blackhole
ip prefix-list LAB19-EXTERNAL seq 10 permit 203.0.113.0/24
route-map LAB19-EXTERNAL permit 10
 match ip address prefix-list LAB19-EXTERNAL
exit
router ospf
 redistribute static route-map LAB19-EXTERNAL
exit
end
