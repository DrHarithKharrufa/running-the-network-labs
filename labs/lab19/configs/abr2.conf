configure terminal
hostname abr2
key chain LAB19
 key 19
  key-string LAB19-DEMO-ONLY-DO-NOT-REUSE-2026
  cryptographic-algorithm hmac-sha-256
 exit
exit
interface eth1
 ip ospf area 2
 bandwidth 10000
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf authentication key-chain LAB19
exit
interface eth2
 ip ospf area 0
 bandwidth 10000
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf authentication key-chain LAB19
exit
interface eth3
 ip ospf area 0
 bandwidth 10000
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf authentication key-chain LAB19
exit
interface lo
 ip ospf area 0
exit
router ospf
 ospf router-id 10.255.0.12
 auto-cost reference-bandwidth 400000
 passive-interface default
 no passive-interface eth1
 no passive-interface eth2
 no passive-interface eth3
exit
end
