{
  "name": "lab13-lacp",
  "topology": {
    "kinds": {
      "linux": {
        "image": "netbook-services:20260916"
      }
    },
    "nodes": {
      "a": {
        "kind": "linux",
        "cmd": "sleep infinity",
        "exec": [
          "ip link add bond0 type bond mode 802.3ad miimon 100 lacp_rate fast xmit_hash_policy layer3+4 min_links 1",
          "ip link set bond0 address 02:00:00:00:13:01",
          "ip link set eth1 down",
          "ip link set eth1 master bond0",
          "ip link set eth2 down",
          "ip link set eth2 master bond0",
          "ip address add 192.0.2.1/30 dev bond0",
          "ip link set bond0 up",
          "ip link set eth1 up",
          "ip link set eth2 up"
        ]
      },
      "b": {
        "kind": "linux",
        "cmd": "sleep infinity",
        "exec": [
          "ip link add bond0 type bond mode 802.3ad miimon 100 lacp_rate fast xmit_hash_policy layer3+4 min_links 1",
          "ip link set bond0 address 02:00:00:00:13:02",
          "ip link set eth1 down",
          "ip link set eth1 master bond0",
          "ip link set eth2 down",
          "ip link set eth2 master bond0",
          "ip address add 192.0.2.2/30 dev bond0",
          "ip link set bond0 up",
          "ip link set eth1 up",
          "ip link set eth2 up"
        ]
      }
    },
    "links": [
      {
        "endpoints": [
          "a:eth1",
          "b:eth1"
        ]
      },
      {
        "endpoints": [
          "a:eth2",
          "b:eth2"
        ]
      }
    ]
  }
}
