configure terminal
hostname man-p-01
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0012.00
 metric-style wide
 lsp-gen-interval 1
exit
interface lo
 ip router isis CORE
 isis passive
exit
interface eth1
 ip router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 3
exit
interface eth2
 ip router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 3
exit
mpls ldp
 router-id 10.255.0.12
 address-family ipv4
  discovery transport-address 10.255.0.12
  interface eth1
  exit
  interface eth2
  exit
 exit-address-family
exit
end
