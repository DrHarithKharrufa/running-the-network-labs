configure terminal
hostname pe3
router isis CORE
 is-type level-2-only
 net 49.0030.0000.0000.0003.00
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
exit
interface lo
 ip router isis CORE
 isis passive
exit
interface eth1
 ip router isis CORE
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
exit
interface eth2
 ip router isis CORE
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
exit
router bgp 64500
 bgp router-id 10.255.30.3
 no bgp default ipv4-unicast
 neighbor 10.255.30.1 remote-as 64500
 neighbor 10.255.30.1 update-source lo
 neighbor 10.255.30.2 remote-as 64500
 neighbor 10.255.30.2 update-source lo
 address-family l2vpn evpn
  neighbor 10.255.30.1 activate
  neighbor 10.255.30.2 activate
  advertise-all-vni
  vni 3000
   rd 10.255.30.3:3000
   route-target import 64500:3000
   route-target export 64500:3000
  exit-vni
 exit-address-family
exit
end
