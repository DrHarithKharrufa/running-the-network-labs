! transit-b: FRR 10.2.1 candidate, static review only.
! Isolated benchmark/documentation ranges; no real Internet.
frr version 10.2
hostname transit-b
!
interface eth1
 ip address 192.0.2.3/31
 no shutdown
!
ip prefix-list FROM-KESTREL seq 10 permit 203.0.113.0/24
route-map FROM-KESTREL permit 10
 match ip address prefix-list FROM-KESTREL
route-map FROM-KESTREL deny 100
!
ip prefix-list TO-KESTREL seq 10 permit 0.0.0.0/0
ip prefix-list TO-KESTREL seq 20 permit 198.18.128.0/17
ip prefix-list TO-KESTREL seq 30 permit 198.19.128.0/17
route-map TO-KESTREL permit 10
 match ip address prefix-list TO-KESTREL
route-map TO-KESTREL deny 100
!
router bgp 64497
 bgp router-id 192.0.2.3
 bgp ebgp-requires-policy
 neighbor 192.0.2.2 remote-as 64500
 address-family ipv4 unicast
  network 0.0.0.0/0
  network 198.18.128.0/17
  network 198.19.128.0/17
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 route-map FROM-KESTREL in
  neighbor 192.0.2.2 route-map TO-KESTREL out
  neighbor 192.0.2.2 send-community both
 exit-address-family
!
ip route 0.0.0.0/0 Null0
ip route 198.18.128.0/17 Null0
ip route 198.19.128.0/17 Null0
