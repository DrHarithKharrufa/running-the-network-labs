! bhm-bng-01 -- Kestrel subscriber edge stand-in, AS 64500.
! A real BNG terminates PPPoE or IPoE sessions (Chapter 32); here it simply
! routes a CGNAT-space subscriber block so the labs have subscriber traffic.
frr version 10.2
hostname bhm-bng-01
!
interface eth1
 description to lds-p-01
 no shutdown
 ip address 10.254.1.6/31
 ip router isis core
 isis network point-to-point
!
interface eth2
 description subscriber aggregation
 no shutdown
 ip address 100.64.0.1/24
!
interface lo
 ip address 10.255.0.24/32
 ip router isis core
 isis passive
!
router isis core
 is-type level-2-only
 net 49.0001.0000.0000.0024.00
 metric-style wide
!
router bgp 64500
 bgp router-id 10.255.0.24
 neighbor KESTREL peer-group
 neighbor KESTREL remote-as 64500
 neighbor KESTREL update-source lo
 neighbor 10.255.0.11 peer-group KESTREL
 neighbor 10.255.0.12 peer-group KESTREL
 neighbor 10.255.0.13 peer-group KESTREL
 neighbor 10.255.0.14 peer-group KESTREL
 neighbor 10.255.0.21 peer-group KESTREL
 neighbor 10.255.0.22 peer-group KESTREL
 neighbor 10.255.0.23 peer-group KESTREL
 !
 address-family ipv4 unicast
  network 100.64.0.0/24
  neighbor KESTREL activate
  neighbor KESTREL send-community both
 exit-address-family
!
line vty
