! cust-a: FRR 10.2.1 candidate, static review only.
! Isolated benchmark/documentation ranges; no real Internet.
frr version 10.2
hostname cust-a
!
interface eth1
 ip address 192.0.2.5/31
 no shutdown
!
interface eth2
 ip address 203.0.113.1/24
 no shutdown
!
ip prefix-list FROM-KESTREL seq 10 permit 0.0.0.0/0
ip prefix-list FROM-KESTREL seq 20 permit 198.18.0.0/17
ip prefix-list FROM-KESTREL seq 30 permit 198.19.0.0/17
ip prefix-list FROM-KESTREL seq 40 permit 198.18.128.0/17
ip prefix-list FROM-KESTREL seq 50 permit 198.19.128.0/17
ip prefix-list FROM-KESTREL seq 60 permit 198.51.100.128/25
route-map FROM-KESTREL permit 10
 match ip address prefix-list FROM-KESTREL
route-map FROM-KESTREL deny 100
!
ip prefix-list TO-KESTREL seq 10 permit 203.0.113.0/24
ip prefix-list TO-KESTREL seq 20 permit 10.0.0.0/8
route-map TO-KESTREL permit 10
 match ip address prefix-list TO-KESTREL
route-map TO-KESTREL deny 100
!
router bgp 64501
 bgp router-id 192.0.2.5
 bgp ebgp-requires-policy
 neighbor 192.0.2.4 remote-as 64500
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 10.0.0.0/8
  neighbor 192.0.2.4 activate
  neighbor 192.0.2.4 route-map FROM-KESTREL in
  neighbor 192.0.2.4 route-map TO-KESTREL out
  neighbor 192.0.2.4 send-community both
 exit-address-family
!
ip route 10.0.0.0/8 Null0
