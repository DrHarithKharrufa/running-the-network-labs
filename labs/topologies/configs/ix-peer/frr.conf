! ix-peer: FRR 10.2.1 candidate, static review only.
! Isolated benchmark/documentation ranges; no real Internet.
frr version 10.2
hostname ix-peer
!
interface eth1
 ip address 198.51.100.1/31
 no shutdown
!
ip prefix-list FROM-KESTREL seq 10 permit 203.0.113.0/24
route-map FROM-KESTREL permit 10
 match ip address prefix-list FROM-KESTREL
route-map FROM-KESTREL deny 100
!
ip prefix-list TO-KESTREL seq 10 permit 198.51.100.128/25
route-map TO-KESTREL permit 10
 match ip address prefix-list TO-KESTREL
route-map TO-KESTREL deny 100
!
router bgp 64498
 bgp router-id 198.51.100.1
 bgp ebgp-requires-policy
 neighbor 198.51.100.0 remote-as 64500
 address-family ipv4 unicast
  network 198.51.100.128/25
  neighbor 198.51.100.0 activate
  neighbor 198.51.100.0 route-map FROM-KESTREL in
  neighbor 198.51.100.0 route-map TO-KESTREL out
  neighbor 198.51.100.0 send-community both
 exit-address-family
!
ip route 198.51.100.128/25 Null0
