configure terminal
hostname transit-a
ip prefix-list IMPORT seq 10 permit 203.0.113.0/24
ip prefix-list IMPORT seq 20 permit 198.18.255.0/24
ip prefix-list ANNOUNCE seq 10 permit 198.18.0.0/24
ip prefix-list ANNOUNCE seq 20 permit 198.19.0.0/24
route-map IMPORT permit 10
 match ip address prefix-list IMPORT
exit
route-map IMPORT deny 100
exit
route-map ANNOUNCE permit 10
 match ip address prefix-list ANNOUNCE
exit
route-map ANNOUNCE deny 100
exit
ip route 198.18.0.0/24 blackhole
ip route 198.19.0.0/24 blackhole
router bgp 64496
 bgp router-id 10.96.0.1
 no bgp default ipv4-unicast
 bgp ebgp-requires-policy
 bgp network import-check
 neighbor 192.0.2.0 remote-as 64500
 neighbor 192.0.2.0 timers 3 9
 neighbor 192.0.2.0 timers connect 1
 neighbor 192.0.2.0 local-role provider strict-mode
 address-family ipv4 unicast
  network 198.18.0.0/24
  network 198.19.0.0/24
  neighbor 192.0.2.0 activate
  neighbor 192.0.2.0 route-map IMPORT in
  neighbor 192.0.2.0 route-map ANNOUNCE out
  neighbor 192.0.2.0 send-community all
  neighbor 192.0.2.0 soft-reconfiguration inbound
  neighbor 192.0.2.0 maximum-prefix 16 75
 exit-address-family
end
