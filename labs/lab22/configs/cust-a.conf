configure terminal
hostname cust-a
ip prefix-list IMPORT seq 10 permit 198.18.0.0/24
ip prefix-list IMPORT seq 20 permit 198.19.0.0/24
ip prefix-list IMPORT seq 30 permit 198.51.100.128/25
ip prefix-list IMPORT seq 40 permit 198.18.255.0/24
ip prefix-list ANNOUNCE seq 10 permit 203.0.113.0/24
ip prefix-list ANNOUNCE seq 20 permit 203.0.113.128/25
ip prefix-list ANNOUNCE seq 30 permit 203.0.113.192/26
ip prefix-list ANNOUNCE seq 40 permit 10.0.0.0/8
ip prefix-list ANNOUNCE seq 50 permit 0.0.0.0/0
route-map IMPORT permit 10
 match ip address prefix-list IMPORT
exit
route-map IMPORT deny 100
exit
route-map ANNOUNCE permit 10
 match ip address prefix-list ANNOUNCE
exit
route-map ANNOUNCE deny 100
exit
ip route 203.0.113.0/24 blackhole
ip route 203.0.113.128/25 blackhole
ip route 203.0.113.192/26 blackhole
ip route 10.0.0.0/8 blackhole
ip route 0.0.0.0/0 blackhole
router bgp 64501
 bgp router-id 10.101.0.1
 no bgp default ipv4-unicast
 bgp ebgp-requires-policy
 bgp network import-check
 neighbor 192.0.2.4 remote-as 64500
 neighbor 192.0.2.4 timers 3 9
 neighbor 192.0.2.4 timers connect 1
 neighbor 192.0.2.4 local-role customer strict-mode
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 203.0.113.128/25
  network 203.0.113.192/26
  network 10.0.0.0/8
  network 0.0.0.0/0
  neighbor 192.0.2.4 activate
  neighbor 192.0.2.4 route-map IMPORT in
  neighbor 192.0.2.4 route-map ANNOUNCE out
  neighbor 192.0.2.4 send-community all
  neighbor 192.0.2.4 soft-reconfiguration inbound
  neighbor 192.0.2.4 maximum-prefix 16 75
 exit-address-family
end
