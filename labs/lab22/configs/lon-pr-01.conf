configure terminal
hostname lon-pr-01
router isis CORE
 is-type level-2-only
 net 49.0001.0102.5500.0021.00
 metric-style wide
 lsp-gen-interval 1
exit
interface lo
 ip router isis CORE
 isis passive
exit
interface eth1
 ip router isis CORE
 isis circuit-type level-2-only
 isis network point-to-point
 isis metric 40
exit
rpki
 rpki polling_period 1
 rpki retry_interval 1
 rpki expire_interval 600
 rpki cache tcp 127.0.0.1 3323 preference 1
exit
ip prefix-list CUST seq 10 permit 203.0.113.0/24
ip prefix-list TRANSIT seq 10 permit 198.18.0.0/24
ip prefix-list TRANSIT seq 20 permit 198.19.0.0/24
ip prefix-list PEER seq 10 permit 198.51.100.128/25
ip prefix-list OWN seq 10 permit 198.18.255.0/24
ip prefix-list TO-CUST seq 10 permit 198.18.0.0/24
ip prefix-list TO-CUST seq 20 permit 198.19.0.0/24
ip prefix-list TO-CUST seq 30 permit 198.51.100.128/25
ip prefix-list TO-CUST seq 40 permit 198.18.255.0/24
bgp as-path access-list CUST permit ^64501(_64501)*$
bgp large-community-list expanded STRIP-LC deny ^64500:100:[123]$
bgp large-community-list expanded STRIP-LC deny ^64500:200:0$
bgp large-community-list expanded STRIP-LC deny ^64500:201:(64496|64498)$
bgp large-community-list expanded STRIP-LC permit .*
bgp large-community-list expanded ALL-LC permit .*
bgp community-list expanded STRIP-STD deny ^(no-export|no-advertise|local-AS|65535:65281|65535:65282|65535:65283)$
bgp community-list expanded STRIP-STD permit .*
bgp extcommunity-list expanded ALL-EXT permit .*
bgp large-community-list standard CUSTOMER permit 64500:1:1
bgp large-community-list standard OWN permit 64500:1:0
bgp large-community-list standard NO-PEER permit 64500:200:0
bgp large-community-list standard NO-TRANSIT-A permit 64500:201:64496
bgp large-community-list standard NO-IX permit 64500:201:64498
bgp large-community-list standard PREP1 permit 64500:100:1
bgp large-community-list standard PREP2 permit 64500:100:2
bgp large-community-list standard PREP3 permit 64500:100:3
route-map CUST-IN deny 5
 match rpki invalid
exit
route-map CUST-IN permit 10
 match ip address prefix-list CUST
 match as-path CUST
 set large-comm-list STRIP-LC delete
 set comm-list STRIP-STD delete
 set extended-comm-list ALL-EXT delete
 on-match goto 30
exit
route-map CUST-IN deny 20
exit
route-map CUST-IN permit 30
 set local-preference 200
 set large-community 64500:1:1 64500:2:11 additive
exit
route-map PEER-IN deny 5
 match rpki invalid
exit
route-map PEER-IN permit 10
 match ip address prefix-list PEER
 set large-comm-list ALL-LC delete
 set comm-list STRIP-STD delete
 set extended-comm-list ALL-EXT delete
 on-match goto 30
exit
route-map PEER-IN deny 20
exit
route-map PEER-IN permit 30
 set local-preference 150
 set large-community 64500:1:2 64500:2:11 additive
exit
route-map TRANSIT-IN deny 5
 match rpki invalid
exit
route-map TRANSIT-IN permit 10
 match ip address prefix-list TRANSIT
 set large-comm-list ALL-LC delete
 set comm-list STRIP-STD delete
 set extended-comm-list ALL-EXT delete
 on-match goto 30
exit
route-map TRANSIT-IN deny 20
exit
route-map TRANSIT-IN permit 30
 set local-preference 100
 set large-community 64500:1:3 64500:2:11 additive
exit
route-map SELF permit 10
 set large-community 64500:1:0 64500:2:11
exit
route-map TRANSIT-OUT permit 5
 match ip address prefix-list OWN
 match large-community OWN
 on-match goto 100
exit
route-map TRANSIT-OUT permit 10
 match ip address prefix-list CUST
 match large-community CUSTOMER
 on-match goto 30
exit
route-map TRANSIT-OUT deny 20
exit
route-map TRANSIT-OUT deny 30
 match large-community NO-TRANSIT-A
exit
route-map TRANSIT-OUT permit 50
 match large-community PREP3
 set as-path prepend 64500 64500 64500
 on-match goto 100
exit
route-map TRANSIT-OUT permit 60
 match large-community PREP2
 set as-path prepend 64500 64500
 on-match goto 100
exit
route-map TRANSIT-OUT permit 70
 match large-community PREP1
 set as-path prepend 64500
 on-match goto 100
exit
route-map TRANSIT-OUT permit 100
 set large-comm-list ALL-LC delete
 set comm-list STRIP-STD delete
 set extended-comm-list ALL-EXT delete
exit
route-map PEER-OUT permit 5
 match ip address prefix-list OWN
 match large-community OWN
 on-match goto 100
exit
route-map PEER-OUT permit 10
 match ip address prefix-list CUST
 match large-community CUSTOMER
 on-match goto 30
exit
route-map PEER-OUT deny 20
exit
route-map PEER-OUT deny 30
 match large-community NO-IX
exit
route-map PEER-OUT deny 40
 match large-community NO-PEER
exit
route-map PEER-OUT permit 100
 set large-comm-list ALL-LC delete
 set comm-list STRIP-STD delete
 set extended-comm-list ALL-EXT delete
exit
route-map CUST-OUT permit 10
 match ip address prefix-list TO-CUST
 set large-comm-list ALL-LC delete
 set comm-list STRIP-STD delete
 set extended-comm-list ALL-EXT delete
exit
route-map CUST-OUT deny 100
exit
ip route 198.18.255.0/24 blackhole
router bgp 64500
 bgp router-id 10.255.0.21
 no bgp default ipv4-unicast
 bgp ebgp-requires-policy
 bgp network import-check
 neighbor 10.255.0.23 remote-as 64500
 neighbor 10.255.0.23 update-source lo
 neighbor 10.255.0.23 timers 3 9
 neighbor 192.0.2.1 remote-as 64496
 neighbor 192.0.2.1 timers 3 9
 neighbor 192.0.2.1 timers connect 1
 neighbor 192.0.2.1 local-role customer strict-mode
 neighbor 198.51.100.1 remote-as 64498
 neighbor 198.51.100.1 timers 3 9
 neighbor 198.51.100.1 timers connect 1
 neighbor 198.51.100.1 local-role peer strict-mode
 address-family ipv4 unicast
  neighbor 10.255.0.23 activate
  neighbor 10.255.0.23 next-hop-self
  neighbor 10.255.0.23 send-community all
  network 198.18.255.0/24 route-map SELF
  neighbor 192.0.2.1 activate
  neighbor 192.0.2.1 route-map TRANSIT-IN in
  neighbor 192.0.2.1 route-map TRANSIT-OUT out
  neighbor 192.0.2.1 send-community all
  neighbor 192.0.2.1 soft-reconfiguration inbound
  neighbor 192.0.2.1 maximum-prefix 16 75
  neighbor 198.51.100.1 activate
  neighbor 198.51.100.1 route-map PEER-IN in
  neighbor 198.51.100.1 route-map PEER-OUT out
  neighbor 198.51.100.1 send-community all
  neighbor 198.51.100.1 soft-reconfiguration inbound
  neighbor 198.51.100.1 maximum-prefix 16 75
 exit-address-family
end
