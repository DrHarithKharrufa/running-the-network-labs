name: lab05
topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.2.1
  nodes:
    r1:
      kind: linux
      exec:
      - ip link set eth2 up
      - ip link set eth1 up
      - ip link set eth1 mtu 9000
      - ip address replace 10.0.12.1/24 dev eth1
      - ip link set eth2 mtu 9000
      - ip address replace 10.0.10.1/24 dev eth2
      - ip route replace 10.0.30.0/24 via 10.0.12.2
      - sysctl -w net.ipv4.ip_forward=1
      - ip route replace 10.0.23.0/24 via 10.0.12.2
    r2:
      kind: linux
      exec:
      - ip link set eth1 up
      - ip link set eth2 up
      - ip link set eth1 mtu 9000
      - ip address replace 10.0.12.2/24 dev eth1
      - ip link set eth2 mtu 1500
      - ip address replace 10.0.23.2/24 dev eth2
      - ip route replace 10.0.10.0/24 via 10.0.12.1
      - ip route replace 10.0.30.0/24 via 10.0.23.3
      - sysctl -w net.ipv4.ip_forward=1
    r3:
      kind: linux
      exec:
      - ip link set eth1 up
      - ip link set eth2 up
      - ip link set eth1 mtu 9000
      - ip address replace 10.0.23.3/24 dev eth1
      - ip link set eth2 mtu 9000
      - ip address replace 10.0.30.1/24 dev eth2
      - ip route replace 10.0.10.0/24 via 10.0.23.2
      - sysctl -w net.ipv4.ip_forward=1
      - ip route replace 10.0.12.0/24 via 10.0.23.2
    h1:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: sleep infinity
      exec:
      - ip link set eth1 up
      - ip link set eth1 mtu 9000
      - ip address replace 10.0.10.10/24 dev eth1
      - ip route replace 10.0.0.0/16 via 10.0.10.1
    h2:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: sleep infinity
      exec:
      - ip link set eth1 up
      - ip link set eth1 mtu 9000
      - ip address replace 10.0.30.10/24 dev eth1
      - ip route replace 10.0.0.0/16 via 10.0.30.1
  links:
  - endpoints:
    - h1:eth1
    - r1:eth2
  - endpoints:
    - r1:eth1
    - r2:eth1
  - endpoints:
    - r2:eth2
    - r3:eth1
  - endpoints:
    - r3:eth2
    - h2:eth1
