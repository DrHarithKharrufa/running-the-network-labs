frr version 10.2
frr defaults traditional
hostname pe2
!
router ospf
 ospf router-id 10.255.0.2
 network 10.255.0.2/32 area 0
 network 10.254.0.0/31 area 0
!
mpls ldp
 router-id 10.255.0.2
 address-family ipv4
  discovery transport-address 10.255.0.2
  interface eth1
 exit-address-family
!
router bgp 64500
 bgp router-id 10.255.0.2
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 64500
 neighbor 10.255.0.1 update-source lo
 address-family ipv4 vpn
  neighbor 10.255.0.1 activate
 exit-address-family
!
ip prefix-list SERVICES-EXPORT seq 10 permit 10.109.0.0/24
!
route-map SERVICES-EXPORT permit 10
 match ip address prefix-list SERVICES-EXPORT
route-map SERVICES-EXPORT deny 100
!
router bgp 64500 vrf SERVICES
 bgp router-id 10.255.0.2
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 10.255.0.2:9000
  label vpn export auto
  rt vpn export 64500:9000
  rt vpn import 64500:1001 64500:1002 64500:1003
  route-map vpn export SERVICES-EXPORT
  export vpn
  import vpn
 exit-address-family
!
