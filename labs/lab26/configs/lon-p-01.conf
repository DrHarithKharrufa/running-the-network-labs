configure terminal
hostname lon-p-01
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0011.00
 metric-style wide
 lsp-gen-interval 1
exit
interface lo
 ip router isis CORE
 isis passive
exit
interface eth1
 ip router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 3
exit
interface eth2
 ip router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 3
exit
interface eth3
 ip router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 isis metric 50
 isis hello-interval 1
 isis hello-multiplier 3
exit
end
