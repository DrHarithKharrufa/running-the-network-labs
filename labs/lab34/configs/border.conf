configure terminal
hostname border
rpki
 rpki cache tcp 127.0.0.1 3323 preference 1
 rpki polling_period 1
 rpki retry_interval 1
 rpki expire_interval 600
exit
ip prefix-list CUSTOMER seq 10 permit 203.0.113.0/24
ip prefix-list PEER-LAB seq 10 permit 198.51.100.0/24
! Deliberately broad candidate for the isolated ROV experiment, not real prefix authority.
ip prefix-list PEER-LAB seq 20 permit 203.0.113.0/24 le 25
route-map CUSTOMER-IN deny 5
 match rpki invalid
exit
route-map CUSTOMER-IN permit 10
 match ip address prefix-list CUSTOMER
 set local-preference 200
exit
route-map PEER-IN deny 5
 match rpki invalid
exit
route-map PEER-IN permit 10
 match ip address prefix-list PEER-LAB
 set local-preference 150
exit
route-map EXPORT-NONE deny 10
exit
router bgp 64500
 bgp router-id 192.0.2.4
 neighbor 192.0.2.1 remote-as 64501
 neighbor 192.0.2.3 remote-as 64502
 address-family ipv4 unicast
  neighbor 192.0.2.1 activate
  neighbor 192.0.2.3 activate
  neighbor 192.0.2.1 soft-reconfiguration inbound
  neighbor 192.0.2.3 soft-reconfiguration inbound
  neighbor 192.0.2.1 route-map CUSTOMER-IN in
  neighbor 192.0.2.3 route-map PEER-IN in
  neighbor 192.0.2.1 route-map EXPORT-NONE out
  neighbor 192.0.2.3 route-map EXPORT-NONE out
 exit-address-family
exit
end
