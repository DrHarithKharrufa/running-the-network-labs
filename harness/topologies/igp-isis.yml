# The same job as OSPF, a different model: IS-IS runs on CLNS, the router is
# named by a NET rather than an IPv4 router-id, and levels replace areas.
#   r1 (L2) ---- r2 (L2) ---- r3 (L1)
name: rtnwb-isis
settle: 4
converge: 60
nodes:
  r1:
    image: quay.io/frrouting/frr:10.2.1
    daemons: [isisd]
    pre:
      - ip address replace 10.0.12.0/31 dev eth1
      - ip address replace 10.255.0.1/32 dev lo
    config:
      - configure terminal
      - interface lo
      - ip router isis CORE
      - isis passive
      - exit
      - interface eth1
      - ip router isis CORE
      - isis network point-to-point
      - isis circuit-type level-2-only
      - exit
      - router isis CORE
      - net 49.0001.0102.5500.0001.00
      - is-type level-2-only
      - metric-style wide
  r2:
    image: quay.io/frrouting/frr:10.2.1
    daemons: [isisd]
    pre:
      - ip address replace 10.0.12.1/31 dev eth1
      - ip address replace 10.0.23.0/31 dev eth2
      - ip address replace 10.255.0.2/32 dev lo
    config:
      - configure terminal
      - interface lo
      - ip router isis CORE
      - isis passive
      - exit
      - interface eth1
      - ip router isis CORE
      - isis network point-to-point
      - isis circuit-type level-2-only
      - exit
      - interface eth2
      - ip router isis CORE
      - isis network point-to-point
      - isis circuit-type level-1
      - isis metric 25
      - exit
      - router isis CORE
      - net 49.0001.0102.5500.0002.00
      - is-type level-1-2
      - metric-style wide
  r3:
    image: quay.io/frrouting/frr:10.2.1
    daemons: [isisd]
    pre:
      - ip address replace 10.0.23.1/31 dev eth1
      - ip address replace 10.255.0.3/32 dev lo
    config:
      - configure terminal
      - interface lo
      - ip router isis CORE
      - isis passive
      - exit
      - interface eth1
      - ip router isis CORE
      - isis network point-to-point
      - isis circuit-type level-1
      - exit
      - router isis CORE
      - net 49.0001.0102.5500.0003.00
      - is-type level-1
      - metric-style wide
links:
  - endpoints: ["r1:eth1", "r2:eth1"]
  - endpoints: ["r2:eth2", "r3:eth1"]
capture:
  - id: level-2-adjacency-up
    node: r1
    cmd: show isis neighbor
    expect: "Up"
  - id: the-router-is-named-by-a-net-not-an-ip
    node: r1
    cmd: show isis summary
    expect: "0102.5500.0001"
  - id: wide-metrics-in-use
    node: r2
    cmd: show isis interface detail
    expect: "Metric: 25"
  - id: level-1-router-has-a-default-not-the-core-prefixes
    node: r3
    cmd: show ip route isis
    expect: "0.0.0.0/0"
  - id: level-2-router-has-the-specifics
    node: r1
    cmd: show ip route isis
    expect: "10.255.0.2/32"
  # Historical observation on this fixture; not a universal FRR limitation.
  # Recheck levels, timers, policy, database completeness and release behaviour.
  - id: abr-has-the-level-1-prefix
    node: r2
    cmd: show ip route 10.255.0.3/32
    expect: "Known via \"isis\""
  # r1 is level-2 only, so its whole database IS the level-2 database. The
  # negative lookahead asserts the prefix is nowhere in it.
  - id: level-2-database-does-not-carry-the-level-1-prefix
    node: r1
    cmd: show isis database detail
    require: ["IS-IS Level-2 link-state database:", "LSP ID", "Extended IP Reachability", "[1-9][0-9]* LSPs"]
    expect: "(?s)^(?!.*10\\.255\\.0\\.3/32).*$"
  - id: level-2-router-cannot-reach-the-level-1-loopback
    node: r1
    cli: shell
    cmd: ping -c 2 -W 2 -I 10.255.0.1 10.255.0.3
    returncodes: [1, 2]
    require: ["PING 10.255.0.3"]
    expect: "(Network unreachable|100% packet loss)"
