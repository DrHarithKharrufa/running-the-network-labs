# Copy to protected wb-https.conf; never commit real credentials.
cacert = "/protected/wb-lab-ca.pem"
connect-timeout = 5
max-time = 10
fail-with-body
# One reviewed authentication mode only:
# user = "READ_ONLY_USERNAME:PROTECTED_SECRET"
# header = "Authorization: Bearer PROTECTED_READ_ONLY_TOKEN"
# The request URL must use the verified certificate hostname.
