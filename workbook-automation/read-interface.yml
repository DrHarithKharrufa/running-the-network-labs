- name: Read the owned iosxe interface
  hosts: iosxe
  gather_facts: false
  serial: 1
  tasks:
  - name: Refuse a mismatched platform/interface
    ansible.builtin.assert:
      that:
      - platform == 'iosxe'
      - owned_interface == 'GigabitEthernet1/0/1'
      fail_msg: Inventory differs from the fixed owned-interface example; review both
        before changing it.
  - name: Read only the declared state
    cisco.ios.ios_command:
      commands:
      - show interfaces GigabitEthernet1/0/1 description
    register: observed
    changed_when: false
